[workspace]
resolver = "2"

members = [
    "app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Ed Swartz (github.com/eswartz)"]
# license = "MIT OR Apache 2"
categories = ["game"]
rust-version = "1.98"

[workspace.lints.rust]
# internal_features = "allow"
# incomplete_features = "allow"

[workspace.metadata.bevy_lint]
# Enable the entire `pedantic` lint group, and make them all warnings.
pedantic = "warn"
unit_in_bundle = "allow"


# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[workspace.lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.avian3d]
opt-level = 2

[profile.dev.package.parry3d]
opt-level = 2

# [profile.dev.package.csgrs]
# opt-level = 2
# [profile.dev.package.rustysynth]
# opt-level = 3
# [profile.dev.package.xsynth-core]
# opt-level = 3

[profile.dev.package.timestretch]
opt-level = 3
[profile.dev.package.bevy_mikktspace]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
# codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
# lto = "thin"
# opt-level = 1

[workspace.dependencies]
eds_bevy_common = { git = "https://github.com/eswartz/eds_bevy_common.git", branch = "main", features = ["firewheel", "bevy_skein", "highlighting", "grabbing", "input_bei", "midi_synth"] }
fedry_runtime = { git = "ssh://git@github.com/eswartz/fedry.git", branch = "main" }
fedry_bevy_plugin = { git = "ssh://git@github.com/eswartz/fedry.git", branch = "main", features = ["egui", "ebc", "midi_synth", "input_bei"] }

game = { path = "game" }

bevy = { version = "0.19", default-features = false, features = [
    "default_app", "default_platform", "common_api", "scene",
    "system_font_discovery",

    # Plus...
    "x11",
    "wayland",

    # Plus...
    "x11",
    "wayland",

    "bevy_dev_tools",
    "jpeg",
    "webp",
    "exr",
    "mp3",

    "track_location",
    "asset_processor",

    # "experimental_pbr_pcss",
    "pbr_light_textures",
] }

# Make a reference so we can override it via patch.crates-io in dependent crates.
gltf = { version = "*" }

wgpu = "29"
rand = { version = "0.10.0" }

bevy-inspector-egui = { git = "ssh://git@github.com/eswartz/bevy-inspector-egui-fork.git", branch = "main", default-features = false, features = ["bevy", "bevy_gizmos", "egui_clipboard" ] } #, "documentation"] } #"highlight_changes"] }
bevy_egui = { version = "0.41", features = ["render", "serde"] }
egui = { version = "0.35", features = ["bytemuck"] }

avian3d = { git = "https://github.com/Jondolf/avian.git", branch = "main", default-features = false, features = [
# avian3d = { version = "0.7.0", default-features = false, features = [
	"3d",
    "default-collider",
	"collider-from-mesh",
    #"f32",
    "parry-f32",
    # "f64", "parry-f64",
    "diagnostic_ui",
    "debug-plugin",
    # "validate",
    "xpbd_joints",
    "bevy_scene",
    "bevy_picking",
    "serialize",
    # "enhanced-determinism",
] }
bevy_enhanced_input = { version = "0.26", features = ["reflect", "state", "serialize"] }

firewheel = { version = "0.10" }

# We must mention it and reference the repo because there's no published crate of 0.8 to patch.
bevy_seedling = { git = "https://github.com/CorvusPrudens/bevy_seedling.git", branch = "master", default-features = false, features = [
    "wav", "ogg", "rand", "reflect", "diagnostics",
    "hrtf",
    "cpal",
    "web_audio",

    "loudness",
    # "dev",
    # 0.10
    # "stream",
    # "scheduled_events",

    # 0.11
    "effects",
] }

bevy_skein = { version = "0.6.0" }

bevy_asset_loader = { version = "0.27.0", features = [
    "2d",
    "3d",
    # "progress_tracking",
] }

bevy_mod_outline = { version = "0.13" }
# bevy_mod_outline = { git = "https://github.com/eswartz/bevy_mod_outline-fork.git" }

bevy_tweening = "0.16.0"

serde = { version = "1.0", features = ["alloc", "derive", "serde_derive"] }

getrandom = { version = "0.4.1", features = ["wasm_js"]}
image = { version = "0.25", default-features = false }
bytemuck = "1.25.0"
anyhow = "1.0.101"

# csgrs = { version = "0.21.0", features = ["bevymesh"] }
# csgrs = { git = "https://github.com/timschmidt/csgrs.git", default-features = false, features = ["bevymesh", "f32"] }

rustysynth = "1.3.6"
# rustysynth = { path = "../rustysynth/rustysynth" }
xsynth-core = "0.3.3"

crossbeam-channel = "0.5.15"

# glam = { version = "0.31", features = ["mint"] }

thiserror = "2.0.12"

test-log = "0.2.18"
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_info",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_info",
] }
console_log = "1.0.0"
rustc-hash = "2.1.1"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
strum_macros = "0.27.2"

timestretch = "0.5.0"
